name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Schema · hygiene · structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install --disable-pip-version-check jsonschema

      - name: Run validate.sh
        run: bash scripts/ci/validate.sh

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Fail on broken internal/repo links; allow external live canon flakes
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --timeout 20
            --retry-wait-time 2
            --max-retries 2
            --accept 200,206,429
            --exclude-mail
            --exclude 'https://github.com/ScanovichAI/.*'
            '**/*.md'
          fail: true
